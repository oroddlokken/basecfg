[project]
name = "voecfg"
version = "0.4.0"
description = "Configuration management"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
extras = ["python-dotenv>=1.0.0", "toml>=0.10.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voecfg"]

# PEP 735 dependency groups — NOT [project.optional-dependencies]
[dependency-groups]
dev = [
    "ruff>=0.16.2",
    "vulture>=2.16",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov==7.1.0",
    "pytest-xdist[psutil]",
    "pytest-xdist==3.8.0",
    "pytest-timeout>=2.4.0",
    "pytest-testmon>=2.2.0",
    "python-dotenv>=1.0.0",
    "rust-just>=1.40.0", # the justfile recipes are the documented dev entrypoint
    "toml>=0.10.2",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "A",     # flake8-builtins
  "ARG",   # flake8-unused-arguments
  "ASYNC", # flake8-async
  "B",     # bugbear
  "BLE",   # flake8-blind-except
  "C4",    # flake8-comprehensions
  "C90",   # McCabe complexity
  "COM",   # flake8-commas
  "D",     # pydocstyle
  "DTZ",   # flake8-datetimez
  "E",     # pycodestyle error
  "EM",    # flake8-errmsg
  "ERA",   # flake8-eradicate
  "EXE",   # flake8-executable
  "F",     # Pyflakes
  "FA",    # flake8-future-annotations
  "FBT",   # flake8-boolean-trap
  "FLY",   # flynt
  "FURB",  # refurb
  "G",     # flake8-logging-format
  "I",     # isort (ruff handles import sorting natively)
  "ICN",   # flake8-import-conventions
  "INP",   # flake8-no-pep420
  "ISC",   # flake8-implicit-str-concat
  "LOG",   # flake8-logging
  "N",     # pep8-naming
  "PERF",  # Perflint
  "PIE",   # flake8-pie
  "PL",    # Pylint (PLC, PLE, PLR, PLW)
  "PT",    # flake8-pytest-style
  "PTH",   # flake8-use-pathlib
  "PYI",   # flake8-pyi
  "Q",     # flake8-quotes
  "RET",   # flake8-return
  "RSE",   # flake8-raise
  "RUF",   # Ruff-specific
  "S",     # flake8-bandit (security)
  "SIM",   # flake8-simplify
  "SLF",   # flake8-self
  "SLOT",  # flake8-slots
  "T10",   # flake8-debugger
  "T20",   # flake8-print
  "TC",    # flake8-type-checking
  "TID",   # flake8-tidy-imports
  "TRY",   # tryceratops
  "UP",    # pyupgrade
  "W",     # pycodestyle warning
  "YTT",   # flake8-2020
]
ignore = [
  "COM812",  # trailing commas — conflicts with ruff formatter
  "RUF100",  # unused blanket noqa directive
  "EXE001",  # shebang present but file not executable
  "D105",    # missing docstring in magic method
  "D107",    # missing docstring in __init__
  "D203",    # blank line before class docstring (conflicts with D211)
  "D212",    # multi-line summary first line (conflicts with D213)
  "D213",    # multi-line summary second line
  "D413",    # missing blank line after last section
  "D416",    # section name should end with colon
  "S101",    # assert used — needed in tests, pyright handles production
  "PLR0913", # too many arguments — not always avoidable
  "PLR2004", # magic value comparison — too noisy for most projects
  "C901",    # McCabe complexity — too rigid for real-world code
  "G004",    # logging f-string — f-strings are fine in logging
  # Tune per-project — uncomment as needed:
  # "TRY301", # abstract raise to inner function
  # "B904",   # raise ... from err
  # "BLE001", # blind except
  # "SLF001", # private member access
  # "TRY401", # redundant exception in logging.exception
  # "FBT001", # boolean positional arg in function definition
  # "FBT002", # boolean default positional arg
  # "T201",   # print found (enable for libraries, ignore for CLIs)
]

[tool.ruff.lint.per-file-ignores]
# RUF012/SLF001: test config classes exercise the _secret_keys/_coercions API as
# users write it — demanding ClassVar here would document the wrong usage.
# S105: the "passwords" are fixture literals asserted against redaction output.
"tests/**" = ["D100", "D101", "D102", "D103", "RUF012", "S105", "SLF001"]

[tool.pyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
stubPath = "./typings"
reportMissingTypeStubs = "none"   # too noisy for most projects
reportPrivateUsage = "none"       # ruff SLF handles this
reportUnusedFunction = "none"     # vulture handles this
deprecateTypingAliases = true
reportUnreachable = true
reportUnusedImport = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "strict"
addopts = [
    "--dist=worksteal",
    "-p", "no:pastebin",
    "-p", "no:nose",
    "-p", "no:doctest",
]
